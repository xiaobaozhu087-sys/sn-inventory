// ====== Embedded Data (loaded dynamically) ======
let EMBEDDED_INVENTORY={};
let EMBEDDED_MAPPING={};
const API_KEY='nQ37Qu1rSakcasgoF86hZzaUByI6cmN';
const COUNTRIES=[{code:'russia',name:'俄罗斯'},{code:'kazakhstan',name:'哈萨克'}];
const SUPPLIERS=['华鹏飞','富润德','其他'];

// ====== State ======
let currentUser=null, currentCountry=null, currentSupplier=null;
let inventoryData=[], snMapping={}, outboundHistory=[];
let filteredData=[], sortCol=-1, sortAsc=1, page=1, pp=100;

// ====== Init ======
document.addEventListener('click',e=>{
  const m=document.getElementById('pwdMenu');
  if(m&&!e.target.closest('#pwdMenu')&&!e.target.onclick) m.style.display='none';
});

// ====== Login ======
function doLogin(e){
  e.preventDefault();
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  // Check users in localStorage
  const users=JSON.parse(localStorage.getItem('sn_users')||'{}');
  if(users[u]&&users[u].password===p){
    currentUser=users[u];
    showSelectPage();
  } else {
    document.getElementById('loginMsg').innerHTML='<div class="err">用户名或密码错误</div>';
  }
  return false;
}

function doLogout(){
  currentUser=null;currentCountry=null;currentSupplier=null;
  document.getElementById('mainApp').style.display='none';
  document.getElementById('selectPage').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

// Init default admin if no users
if(!localStorage.getItem('sn_users')){
  localStorage.setItem('sn_users',JSON.stringify({
    admin:{password:'admin',name:'管理员',role:'admin',countries:[],suppliers:[]}
  }));
}

// ====== Country/Supplier Select ======
function showSelectPage(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('selectPage').style.display='flex';
  // Render countries
  const availCountries=currentUser.role==='admin'?COUNTRIES:COUNTRIES.filter(c=>currentUser.countries.includes(c.code));
  document.getElementById('countryList').innerHTML=availCountries.map(c=>
    `<button class="btn btn-sm btn-s" style="text-align:left" onclick="selectCountry('${c.code}','${c.name}')">${c.name}</button>`
  ).join('');
}

function selectCountry(code,name){
  currentCountry={code,name};
  document.querySelectorAll('#countryList button').forEach(b=>{b.classList.remove('btn-p');b.classList.add('btn-s')});
  event.target.classList.add('btn-p');event.target.classList.remove('btn-s');
  // Render suppliers
  const availSuppliers=currentUser.role==='admin'?SUPPLIERS:(currentUser.suppliers||SUPPLIERS);
  document.getElementById('supplierList').innerHTML=availSuppliers.map(s=>
    `<button class="btn btn-sm btn-s" style="text-align:left" onclick="selectSupplier('${s}')">${s}</button>`
  ).join('');
}

function selectSupplier(name){
  currentSupplier=name;
  document.querySelectorAll('#supplierList button').forEach(b=>{b.classList.remove('btn-p');b.classList.add('btn-s')});
  event.target.classList.add('btn-p');event.target.classList.remove('btn-s');
  document.getElementById('enterBtn').disabled=false;
  document.getElementById('enterBtn').style.opacity=1;
}

function enterMain(){
  if(!currentCountry||!currentSupplier)return;
  document.getElementById('selectPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('navCountry').textContent=currentCountry.name;
  document.getElementById('navSupplier').textContent=currentSupplier;
  document.getElementById('navUser').textContent=currentUser.name;
  showUsersTab();
  loadAllData();
}

// ====== Change Password ======
function showChangePwd(){
  const m=document.getElementById('pwdMenu');
  m.style.display=m.style.display==='block'?'none':'block';
}
function changePwdForm(){
  document.getElementById('pwdMenu').style.display='none';
  document.getElementById('pwdModal').style.display='flex';
}
function closePwdModal(){
  document.getElementById('pwdModal').style.display='none';
  document.getElementById('oldPwd').value='';
  document.getElementById('newPwd').value='';
  document.getElementById('pwdResult').innerHTML='';
}
function doChangePwd(e){
  e.preventDefault();
  const oldP=document.getElementById('oldPwd').value;
  const newP=document.getElementById('newPwd').value;
  if(newP.length<6){document.getElementById('pwdResult').innerHTML='<div class="err">新密码至少6位</div>';return false}
  const users=JSON.parse(localStorage.getItem('sn_users')||'{}');
  const u=Object.keys(users).find(k=>users[k].name===currentUser.name);
  if(!u||users[u].password!==oldP){
    document.getElementById('pwdResult').innerHTML='<div class="err">原密码错误</div>';
    return false;
  }
  users[u].password=newP;
  localStorage.setItem('sn_users',JSON.stringify(users));
  document.getElementById('pwdResult').innerHTML='<div class="ok">密码修改成功</div>';
  setTimeout(closePwdModal,1500);
  return false;
}

// ====== Tab Switch ======
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='history')renderHistory();
}

// ====== Data Loading ======
async function loadAllData(){
  document.getElementById('invBody').innerHTML='<tr><td colspan="12" class="loading">⏳ 加载中...</td></tr>';
  try{
    const dataBase = './data';
    // Load inventory
    const invRes = await fetch(dataBase + '/' + currentCountry.code + '.json');
    if(invRes.ok){
      inventoryData = await invRes.json();
    }else{
      inventoryData = [];
    }
    // Load mapping
    const mapRes = await fetch(dataBase + '/mapping.json');
    if(mapRes.ok){
      snMapping = await mapRes.json();
    }
  }catch(e){
    // Try embedded data as fallback
    inventoryData = EMBEDDED_INVENTORY[currentCountry.code] || [];
    snMapping = EMBEDDED_MAPPING;
  }
  // Load history from localStorage
  outboundHistory = JSON.parse(localStorage.getItem('outbound_history_' + currentCountry.code) || '[]');
  buildFilters();
  filterData();
  renderHistory();
}

async function loadInventory(){
  document.getElementById('invBody').innerHTML='<tr><td colspan="12" class="loading">⏳ 加载中...</td></tr>';
  try{
    const invRes = await fetch('./data/' + currentCountry.code + '.json');
    if(invRes.ok){
      inventoryData = await invRes.json();
    }
  }catch(e){}
  buildFilters();
  filterData();
}

async function loadHistory(){
  outboundHistory = JSON.parse(localStorage.getItem('outbound_history_' + currentCountry.code) || '[]');
  renderHistory();
}

// ====== Save Data via API ======
async function saveInventory(){
  // Save to localStorage (per country)
  localStorage.setItem('inventory_' + currentCountry.code, JSON.stringify(inventoryData));
}

async function saveHistory(){
  localStorage.setItem('outbound_history_' + currentCountry.code, JSON.stringify(outboundHistory));
}

// ====== Inventory Display ======
const COLS=['sn','inbound_date','batch','sn_prefix','power','model','location_code','location_date','warehouse','ownership','status'];
const COL_NAMES=['SN','入库日期','入库批次','SN前7位','算力','匹配机型','库位','库位更新日期','所在仓库','归属','机器状态'];

function buildFilters(){
  const getUniq=idx=>[...new Set(inventoryData.map(r=>r[idx]||''))].filter(x=>x).sort();
  ['warehouse','ownership','status','model','power'].forEach((key,i)=>{
    const ids=['f-wh','f-owner','f-status','f-model','f-power'];
    const sel=document.getElementById(ids[i]);
    sel.innerHTML='<option value="">全部'+['仓库','归属','状态','机型','算力'][i]+'</option>'+getUniq(key).map(v=>`<option value="${v}">${v}</option>`).join('');
  });
}

function filterData(){
  let rows=inventoryData;
  const wh=document.getElementById('f-wh').value;
  const owner=document.getElementById('f-owner').value;
  const status=document.getElementById('f-status').value;
  const model=document.getElementById('f-model').value;
  const power=document.getElementById('f-power').value;
  const search=document.getElementById('searchInput').value.toLowerCase().trim().split(/\s+/).filter(x=>x);
  if(wh)rows=rows.filter(r=>r.warehouse===wh);
  if(owner)rows=rows.filter(r=>r.ownership===owner);
  if(status)rows=rows.filter(r=>r.status===status);
  if(model)rows=rows.filter(r=>r.model===model);
  if(power)rows=rows.filter(r=>r.power===power);
  if(search.length)rows=rows.filter(r=>search.some(k=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(k))));
  if(sortCol>=0)rows=[...rows].sort((a,b)=>{
    const x=a[COLS[sortCol]]||'',y=b[COLS[sortCol]]||'';
    return x===y?0:(x>y?sortAsc:-sortAsc);
  });
  filteredData=rows;
  // Stats
  document.getElementById('invStats').innerHTML=`<div class="st">记录数 <span class="v">${rows.length}</span></div><div class="st">机型数 <span class="v">${new Set(rows.map(r=>r.model)).size}</span></div><div class="st">仓库数 <span class="v">${new Set(rows.map(r=>r.warehouse)).size}</span></div>`;
  // Table
  let h='<tr>';
  COL_NAMES.forEach((c,i)=>h+=`<th onclick="setSort(${i})">${c}${sortCol===i?(sortAsc?' ▲':' ▼'):''}</th>`);
  h+='</tr>';
  document.getElementById('invTable').querySelector('thead').innerHTML=h;
  const tp=Math.ceil(rows.length/pp)||1;
  if(page>tp)page=1;
  const start=(page-1)*pp;
  const pr=rows.slice(start,start+pp);
  let body='';
  pr.forEach(r=>{
    body+='<tr>';
    COLS.forEach(c=>body+=`<td>${r[c]||''}</td>`);
    body+='</tr>';
  });
  if(!pr.length)body='<tr><td colspan="12" class="loading">无数据</td></tr>';
  document.getElementById('invBody').innerHTML=body;
  // Pager
  let pg=`<button onclick="goPage(1)" ${page<=1?'disabled':''}>首页</button><button onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹</button><span style="padding:0 6px">${page}/${tp}</span><button onclick="goPage(${page+1})" ${page>=tp?'disabled':''}>›</button><button onclick="goPage(${tp})" ${page>=tp?'disabled':''}>末页</button>`;
  document.getElementById('pager').innerHTML=pg;
}

function setSort(i){if(sortCol===i)sortAsc=-sortAsc;else{sortCol=i;sortAsc=1}filterData()}
function goPage(p){page=p;filterData()}
function resetFilters(){['f-wh','f-owner','f-status','f-model','f-power'].forEach(id=>document.getElementById(id).value='');document.getElementById('searchInput').value='';sortCol=-1;page=1;filterData()}

// ====== Export ======
function exportInventory(){
  if(!filteredData.length)return;
  const data=[COL_NAMES,...filteredData.map(r=>COLS.map(c=>r[c]||''))];
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[{wch:18},{wch:20},{wch:25},{wch:10},{wch:8},{wch:15},{wch:12},{wch:12},{wch:12},{wch:10},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'总在库数据');
  XLSX.writeFile(wb,`SN库存_${currentCountry.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ====== Inbound ======
let inboundPending=null;
function handleInboundFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(!rows.length)return;
    // Auto detect SN column and status column
    let snCol=-1,statusCol=-1;
    for(let c=0;c<rows[0].length;c++){
      const header=String(rows[0][c]||'').toLowerCase();
      if(header.includes('sn')||header.includes('序列号')){if(snCol<0)snCol=c}
      if(header.includes('状态')||header.includes('status')){if(statusCol<0)statusCol=c}
    }
    // If not found in headers, detect by data
    if(snCol<0){
      for(let c=0;c<Math.min(rows[0].length,20);c++){
        let snCount=0;
        for(let r=1;r<Math.min(rows.length,20);r++){
          const v=String(rows[r][c]||'');
          if(v.length>=15&&v.length<=20&&/^[A-Za-z0-9]+$/.test(v))snCount++;
        }
        if(snCount>5){snCol=c;break}
      }
    }
    if(statusCol<0){
      for(let c=0;c<Math.min(rows[0].length,20);c++){
        if(c===snCol)continue;
        let stCount=0;
        for(let r=1;r<Math.min(rows.length,20);r++){
          const v=String(rows[r][c]||'');
          if(/良品|不良|待维修|待测|报废|故障|新机|备机/.test(v))stCount++;
        }
        if(stCount>3){statusCol=c;break}
      }
    }
    if(snCol<0){document.getElementById('inboundStatus').innerHTML='<div class="err">未识别到SN列，请确保Excel中有17位字母数字的SN列</div>';return}
    // Parse rows
    const items=[];
    for(let r=1;r<rows.length;r++){
      const sn=String(rows[r][snCol]||'').trim();
      if(!sn||sn.length<5)continue;
      const status=statusCol>=0?String(rows[r][statusCol]||'').trim():'';
      const prefix=sn.substring(0,7).toUpperCase();
      const mapping=snMapping[prefix];
      items.push({
        sn, inbound_date:new Date().toISOString().slice(0,10),
        batch:document.getElementById('inboundBatch').value||'',
        sn_prefix:prefix, power:mapping?mapping.power||'':'未知',
        model:mapping?mapping.model||'':'未知',
        location_code:'', location_date:'', warehouse:'', ownership:'', status
      });
    }
    inboundPending=items;
    const unknownCount=items.filter(i=>i.model==='未知').length;
    let html=`<div class="preview"><h3 style="font-size:14px;margin-bottom:8px">识别到 ${items.length} 条SN，${unknownCount} 条机型未知</div>`;
    html+=`<div style="font-size:12px;color:var(--m);margin-bottom:8px">SN列: 第${snCol+1}列${statusCol>=0?'，状态列: 第'+(statusCol+1)+'列':'，未识别到状态列'}</div>`;
    html+='<div class="twrap" style="max-height:300px"><table><thead><tr><th>SN</th><th>机型</th><th>算力</th><th>状态</th></tr></thead><tbody>';
    items.slice(0,50).forEach(i=>{
      const cls=i.model==='未知'?'class="unknown-hl"':'';
      html+=`<tr ${cls}><td>${i.sn}</td><td>${i.model}</td><td>${i.power}</td><td>${i.status||'-'}</td></tr>`;
    });
    html+='</tbody></table></div>';
    if(items.length>50)html+=`<div style="text-align:center;padding:8px;color:var(--m)">显示前50条，共${items.length}条</div>`;
    html+=`<button class="btn btn-g" style="margin-top:12px" onclick="confirmInbound()">✅ 确认入库（${items.length}条）</button>`;
    html+='</div>';
    document.getElementById('inboundPreview').innerHTML=html;
    document.getElementById('inboundStatus').innerHTML='';
  };
  reader.readAsArrayBuffer(file);
}

async function confirmInbound(){
  if(!inboundPending)return;
  document.getElementById('inboundStatus').innerHTML='<div class="ok">⏳ 正在入库...</div>';
  // Append to inventory
  inventoryData=inventoryData.concat(inboundPending);
  await saveInventory();
  document.getElementById('inboundStatus').innerHTML=`<div class="ok">✅ 入库成功！新增 ${inboundPending.length} 条记录</div>`;
  document.getElementById('inboundPreview').innerHTML='';
  inboundPending=null;
  buildFilters();filterData();
}

// ====== Outbound ======
let outboundPending=null;
function handleOutboundFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(!rows.length)return;
    // Auto detect SN column
    let snCol=-1;
    for(let c=0;c<rows[0].length;c++){
      const header=String(rows[0][c]||'').toLowerCase();
      if(header.includes('sn')||header.includes('序列号')){snCol=c;break}
    }
    if(snCol<0){
      for(let c=0;c<Math.min(rows[0].length,20);c++){
        let snCount=0;
        for(let r=1;r<Math.min(rows.length,20);r++){
          const v=String(rows[r][c]||'');
          if(v.length>=15&&v.length<=20&&/^[A-Za-z0-9]+$/.test(v))snCount++;
        }
        if(snCount>5){snCol=c;break}
      }
    }
    if(snCol<0){document.getElementById('outboundStatus').innerHTML='<div class="err">未识别到SN列</div>';return}
    const sns=[];
    for(let r=1;r<rows.length;r++){
      const sn=String(rows[r][snCol]||'').trim();
      if(sn&&sn.length>=5)sns.push(sn);
    }
    // Check which are in stock
    const inStockSet=new Set(inventoryData.map(r=>r.sn));
    const items=sns.map(sn=>({sn, inStock:inStockSet.has(sn)}));
    const inCount=items.filter(i=>i.inStock).length;
    const outCount=items.length-inCount;
    outboundPending=items.filter(i=>i.inStock);
    let html=`<div class="preview"><h3 style="font-size:14px;margin-bottom:8px">识别到 ${items.length} 条SN，${inCount} 条在库，${outCount} 条不在库</h3>`;
    html+='<div class="twrap" style="max-height:300px"><table><thead><tr><th>SN</th><th>状态</th></tr></thead><tbody>';
    items.slice(0,100).forEach(i=>{
      html+=`<tr><td>${i.sn}</td><td class="${i.inStock?'in-stock':'not-in-stock'}">${i.inStock?'✅ 在库':'❌ 不在库'}</td></tr>`;
    });
    html+='</tbody></table></div>';
    if(items.length>100)html+=`<div style="text-align:center;padding:8px;color:var(--m)">显示前100条，共${items.length}条</div>`;
    if(inCount>0)html+=`<button class="btn btn-r" style="margin-top:12px" onclick="confirmOutbound()">✅ 确认出库（${inCount}条在库SN）</button>`;
    html+='</div>';
    document.getElementById('outboundPreview').innerHTML=html;
    document.getElementById('outboundStatus').innerHTML='';
  };
  reader.readAsArrayBuffer(file);
}

async function confirmOutbound(){
  if(!outboundPending||!outboundPending.length)return;
  document.getElementById('outboundStatus').innerHTML='<div class="ok">⏳ 正在出库...</div>';
  const batch=document.getElementById('outboundBatch').value||'无批次';
  const outSns=new Set(outboundPending.map(i=>i.sn));
  const removed=inventoryData.filter(r=>outSns.has(r.sn));
  inventoryData=inventoryData.filter(r=>!outSns.has(r.sn));
  // Add to history
  outboundHistory.unshift({
    batch, time:new Date().toLocaleString('zh-CN'),
    count:removed.length, user:currentUser.name,
    country:currentCountry.code, supplier:currentSupplier,
    items:removed
  });
  await saveInventory();
  await saveHistory();
  document.getElementById('outboundStatus').innerHTML=`<div class="ok">✅ 出库成功！移除 ${removed.length} 条记录</div>`;
  document.getElementById('outboundPreview').innerHTML='';
  outboundPending=null;
  buildFilters();filterData();renderHistory();
}

// ====== History ======
function renderHistory(){
  const search=document.getElementById('histSearch').value.toLowerCase().trim();
  let rows=outboundHistory.filter(h=>h.country===currentCountry.code);
  if(search)rows=rows.filter(h=>h.batch.toLowerCase().includes(search)||h.user.toLowerCase().includes(search));
  document.getElementById('histStats').innerHTML=`<div class="st">出库批次 <span class="v">${rows.length}</span></div><div class="st">总出库SN <span class="v">${rows.reduce((s,r)=>s+r.count,0)}</span></div>`;
  let body='';
  rows.forEach((h,i)=>{
    body+=`<tr><td>${h.batch}</td><td>${h.time}</td><td>${h.count}</td><td>${h.user}</td><td><button class="btn-t btn-s" onclick="toggleHistDetail(${i})">展开</button> <button class="btn-t btn-g" onclick="exportBatch(${i})">导出</button></td></tr>`;
    body+=`<tr id="hist-detail-${i}" style="display:none"><td colspan="5"><div class="twrap" style="max-height:300px"><table><thead><tr><th>SN</th><th>机型</th><th>算力</th><th>仓库</th><th>归属</th></tr></thead><tbody>`;
    (h.items||[]).forEach(it=>{
      body+=`<tr><td>${it.sn||''}</td><td>${it.model||''}</td><td>${it.power||''}</td><td>${it.warehouse||''}</td><td>${it.ownership||''}</td></tr>`;
    });
    body+='</tbody></table></div></td></tr>';
  });
  if(!rows.length)body='<tr><td colspan="5" class="loading">暂无出库记录</td></tr>';
  document.getElementById('histBody').innerHTML=body;
}

function toggleHistDetail(i){
  const el=document.getElementById('hist-detail-'+i);
  el.style.display=el.style.display==='none'?'table-row':'none';
  el.previousElementSibling.querySelector('button').textContent=el.style.display==='none'?'展开':'收起';
}

function exportBatch(i){
  const h=outboundHistory.filter(x=>x.country===currentCountry.code)[i];
  if(!h||!h.items)return;
  const data=[['SN','机型','算力','仓库','归属'],...h.items.map(it=>[it.sn||'',it.model||'',it.power||'',it.warehouse||'',it.ownership||''])];
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'出库明细');
  XLSX.writeFile(wb,`出库_${h.batch}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportHistory(){
  const rows=outboundHistory.filter(h=>h.country===currentCountry.code);
  if(!rows.length)return;
  const data=[['批次号','出库时间','SN数量','操作人'],...rows.map(r=>[r.batch,r.time,r.count,r.user])];
  const ws=XLSX.utils.aoa_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'出库历史');
  XLSX.writeFile(wb,`出库历史_${currentCountry.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ====== Back to Select ======
function goBackSelect(){
  document.getElementById('mainApp').style.display='none';
  document.getElementById('selectPage').style.display='flex';
  // Re-render country list
  const availCountries=currentUser.role==='admin'?COUNTRIES:COUNTRIES.filter(c=>currentUser.countries.includes(c.code));
  document.getElementById('countryList').innerHTML=availCountries.map(c=>
    `<button class="btn btn-sm btn-s" style="text-align:left" onclick="selectCountry('${c.code}','${c.name}')">${c.name}</button>`
  ).join('');
  document.getElementById('supplierList').innerHTML='';
  document.getElementById('enterBtn').disabled=true;
  document.getElementById('enterBtn').style.opacity=.4;
}

// ====== SN Query ======
async function doSnQuery(){
  const input=document.getElementById('snQueryInput').value.trim();
  if(!input)return;
  const queries=input.split(/[,
]/).map(s=>s.trim()).filter(s=>s);
  let html='';
  for(const q of queries){
    const prefix=q.substring(0,7).toUpperCase();
    const m=snMapping[prefix];
    if(m){
      html+=`<div class="preview" style="margin-bottom:8px"><div style="display:flex;gap:16px;font-size:14px"><span><b>SN:</b> ${q}</span><span><b>前缀:</b> ${prefix}</span><span><b>机型:</b> ${m.model||'-'}</span><span><b>算力:</b> ${m.power||'-'}</span></div></div>`;
    }else{
      html+=`<div class="preview" style="margin-bottom:8px;border-color:var(--y)"><div style="font-size:14px;color:var(--y)">⚠ SN: ${q} — 前缀 ${prefix} 未匹配到机型算力</div></div>`;
    }
  }
  document.getElementById('snQueryResult').innerHTML=html||'<div class="err">无结果</div>';
}

// ====== User Management ======
function showUsersTab(){
  if(currentUser.role==='admin'){
    document.getElementById('usersTab').style.display='block';
    renderUsers();
  }
}

function renderUsers(){
  const users=JSON.parse(localStorage.getItem('sn_users')||'{}');
  let html='';
  for(const [uname,u] of Object.entries(users)){
    if(uname==='__proto__')continue;
    const countries=(u.countries||[]).map(c=>COUNTRIES.find(x=>x.code===c)?.name||c).join(',');
    html+=`<tr><td>${uname}</td><td>${u.name}</td><td>${u.role==='admin'?'管理员':'操作员'}</td><td>${countries||'全部'}</td><td>${(u.suppliers||[]).join(',')||'全部'}</td><td>`;
    if(uname!=='admin'){
      html+=`<button class="btn-t btn-r" onclick="deleteUser('${uname}')">删除</button>`;
    }else{
      html+='—';
    }
    html+='</td></tr>';
  }
  document.getElementById('userTableBody').innerHTML=html;
}

function addUser(e){
  e.preventDefault();
  const uname=document.getElementById('newUserName').value.trim();
  const disp=document.getElementById('newUserDisp').value.trim();
  const role=document.getElementById('newUserRole').value;
  const countries=Array.from(document.getElementById('newUserCountry').selectedOptions).map(o=>o.value);
  const suppliers=document.getElementById('newUserSupplier').value.split(',').map(s=>s.trim()).filter(s=>s);
  if(!uname||!disp){document.getElementById('userMsg').innerHTML='<div class="err">请填写用户名和显示名</div>';return false}
  const users=JSON.parse(localStorage.getItem('sn_users')||'{}');
  if(users[uname]){document.getElementById('userMsg').innerHTML='<div class="err">用户名已存在</div>';return false}
  users[uname]={password:uname,name:disp,role,countries,suppliers};
  localStorage.setItem('sn_users',JSON.stringify(users));
  document.getElementById('userMsg').innerHTML='<div class="ok">用户添加成功，初始密码同用户名</div>';
  document.getElementById('newUserName').value='';
  document.getElementById('newUserDisp').value='';
  document.getElementById('newUserSupplier').value='';
  renderUsers();
  return false;
}

function deleteUser(uname){
  if(!confirm(`确定删除用户 ${uname}？`))return;
  const users=JSON.parse(localStorage.getItem('sn_users')||'{}');
  delete users[uname];
  localStorage.setItem('sn_users',JSON.stringify(users));
  renderUsers();
}

// ====== Drag & Drop ======
['inboundDrop','outboundDrop'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('dragover',e=>{e.preventDefault();el.style.borderColor='var(--accent)';el.style.background='#f0f5ff'});
  el.addEventListener('dragleave',e=>{el.style.borderColor='var(--b)';el.style.background='var(--s)'});
  el.addEventListener('drop',e=>{
    e.preventDefault();el.style.borderColor='var(--b)';el.style.background='var(--s)';
    if(e.dataTransfer.files.length){
      const fileInput=id==='inboundDrop'?'inboundFile':'outboundFile';
      document.getElementById(fileInput).files=e.dataTransfer.files;
      if(id==='inboundDrop')handleInboundFile(e.dataTransfer.files[0]);
      else handleOutboundFile(e.dataTransfer.files[0]);
    }
  });
});
